rootLogger.level=DEBUG

property.filename=log/dummy-api.log

appenders=file

appender.file.type=RollingFile
appender.file.name=DailyRollingFileAppender
appender.file.fileName=${filename}
appender.file.filePattern=${filename}.%d{yyyy-MM-dd}
appender.file.layout.type=PatternLayout
appender.file.layout.pattern=%d{yyyy-MM-dd HH:mm:ss} [%p] [%t] [%X{sessionId}] [%C:%L %M()] %m%n
appender.file.policies.type=Policies
appender.file.policies.time.type=TimeBasedTriggeringPolicy
appender.file.policies.time.interval=1

rootLogger.appenderRefs=file

rootLogger.appenderRef.file.ref=DailyRollingFileAppender
